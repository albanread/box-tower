[package]
name = "rosapps-tower"
version = "0.1.0"
edition = "2021"
description = "!Tower's engine (ROSAPPS): the tower simulation (tower-sim), published to the presenter as the tower surface (ROS_SURF_TOWER)"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
serde_json = "1"
miniz_oxide = "0.8"
tower-sim = { path = "../../tower/sim" }
tower-surface = { path = "../../tower/surface" }
