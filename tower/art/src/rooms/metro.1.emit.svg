<!-- Drawn for this port, replacing tower-together's metro.svg (MIT, Patrick Hulin),
     which was an 80x80 picture stretched over the whole stack. Kept from it:
     the cream subway tiles, red line band, grey platform with its yellow edge line and
     the dark track. New: the station laid out for its real footprint (30 cells x
     3 floors): the ticket hall on the top floor (machines, gates, a line map with
     no names, departure board, stairs down) over a vaulted platform hall two floors
     high. metro.1 has a train in.
     Night layer: the station under its own light (it is underground), then lamps, screens, signals, backlit posters, the train's windows. -->
